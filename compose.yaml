services:
  c64-basic:
    build: .
    ports:
      - "${HOST_PORT:-8134}:8080"
    environment:
      PROGRAM_DIRECTORY: /programs
    volumes:
      - .:/programs:ro
      - screenshot-cache:/app/screenshot-cache
    restart: unless-stopped

  assembler:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/acme/Dockerfile
    working_dir: /programs
    volumes:
      - .:/programs

  screenshots:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/screenshots/Dockerfile
    working_dir: /programs
    environment:
      SCREENSHOT_BASE_URL: http://c64-basic:8080
    volumes:
      - .:/programs
    depends_on:
      - c64-basic

volumes:
  screenshot-cache:

