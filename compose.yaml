services:
  c64-basic:
    build: .
    ports:
      - "${HOST_PORT:-8134}:8080"
    environment:
      PROGRAM_DIRECTORY: /programs
    volumes:
      - .:/programs:ro
    restart: unless-stopped

  assembler:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/acme/Dockerfile
    working_dir: /programs
    volumes:
      - .:/programs

